<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>F4 Community</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

:root{
    --red:#e50914;
    --black:#050505;
    --dark:#111;
    --gray:#777;
    --light:#f4f4f4;
    --white:#fff;
}

body{
    font-family:Arial,Helvetica,sans-serif;
    background:var(--light);
    color:#111;
    min-height:100vh;
}

/* =========================
   HEADER
========================= */

header{
    position:sticky;
    top:0;
    z-index:1000;
    background:rgba(5,5,5,.96);
    backdrop-filter:blur(15px);
    color:white;
    border-bottom:1px solid #222;
}

.nav{
    width:94%;
    max-width:1150px;
    margin:auto;
    min-height:65px;

    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:15px;
}

.logo{
    font-size:38px;
    font-weight:1000;
    letter-spacing:-6px;
}

.logo span{
    color:var(--red);
}

.nav-right{
    display:flex;
    align-items:center;
    gap:10px;
}

.logout{
    border:none;
    background:var(--red);
    color:white;
    padding:10px 15px;
    border-radius:9px;
    font-weight:bold;
    cursor:pointer;
}

/* =========================
   MAIN
========================= */

.container{
    width:94%;
    max-width:1150px;
    margin:25px auto;
}

/* =========================
   WELCOME
========================= */

.welcome{
    position:relative;
    overflow:hidden;
    background:linear-gradient(
        135deg,
        #050505,
        #171717
    );
    color:white;
    padding:30px;
    border-radius:24px;
    margin-bottom:20px;
    box-shadow:0 15px 35px rgba(0,0,0,.15);
}

.welcome:after{
    content:"F4";
    position:absolute;
    right:-20px;
    bottom:-55px;
    font-size:170px;
    font-weight:1000;
    color:rgba(255,255,255,.035);
}

.welcome h1{
    position:relative;
    z-index:2;
    font-size:30px;
}

.welcome h1 span{
    color:var(--red);
}

.welcome p{
    position:relative;
    z-index:2;
    color:#bbb;
    margin-top:8px;
}

/* =========================
   CARDS
========================= */

.card{
    background:white;
    border-radius:20px;
    padding:20px;
    margin-bottom:20px;
    box-shadow:0 6px 25px rgba(0,0,0,.06);
}

.card-title{
    font-size:21px;
    font-weight:800;
    margin-bottom:15px;
}

/* =========================
   PROFILE
========================= */

.profile{
    display:flex;
    align-items:center;
    gap:15px;
}

.profile-pic-wrapper{
    position:relative;
}

.profile-pic{
    width:75px;
    height:75px;
    border-radius:50%;
    background:var(--black);
    color:white;

    display:flex;
    align-items:center;
    justify-content:center;

    overflow:hidden;
    font-size:28px;
    font-weight:bold;

    border:3px solid var(--red);
}

.profile-pic img{
    width:100%;
    height:100%;
    object-fit:cover;
}

.change-photo{
    position:absolute;
    right:-4px;
    bottom:-4px;

    width:28px;
    height:28px;
    border-radius:50%;

    border:2px solid white;
    background:var(--red);
    color:white;

    cursor:pointer;
}

.profile-info{
    flex:1;
}

.profile-name{
    font-size:20px;
    font-weight:bold;
}

.profile-email{
    color:var(--gray);
    font-size:13px;
    margin-top:4px;
}

/* =========================
   ANNOUNCEMENTS
========================= */

.announcement-card{
    border-left:5px solid var(--red);
}

.announcement{
    background:var(--black);
    color:white;
    padding:16px;
    border-radius:13px;
    margin-bottom:10px;
}

.announcement:last-child{
    margin-bottom:0;
}

.announcement-text{
    line-height:1.55;
}

.announcement-footer{
    color:#999;
    font-size:11px;
    margin-top:8px;
}

/* =========================
   COMPOSER
========================= */

.composer textarea{
    width:100%;
    min-height:110px;
    resize:vertical;

    border:1px solid #ddd;
    border-radius:14px;

    padding:14px;

    font-family:Arial;
    font-size:15px;

    outline:none;
}

.composer textarea:focus{
    border-color:var(--red);
}

.upload-preview{
    margin-top:12px;
}

.preview-image,
.preview-video{
    max-width:100%;
    max-height:300px;
    border-radius:13px;
    display:none;
}

.composer-tools{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
    margin-top:12px;
}

.upload-buttons{
    display:flex;
    gap:8px;
    flex-wrap:wrap;
}

.upload-btn{
    background:#eee;
    border:none;
    padding:10px 13px;
    border-radius:9px;
    cursor:pointer;
    font-weight:bold;
}

.upload-btn:hover{
    background:#ddd;
}

.post-btn{
    background:var(--red);
    color:white;
    border:none;
    padding:11px 20px;
    border-radius:9px;
    font-weight:bold;
    cursor:pointer;
}

.post-btn:disabled{
    opacity:.5;
}

/* =========================
   FEED
========================= */

.post{
    background:white;
    border:1px solid #eee;
    border-radius:17px;
    padding:16px;
    margin-bottom:14px;
}

.post-header{
    display:flex;
    align-items:center;
    gap:10px;
}

.post-avatar{
    width:45px;
    height:45px;
    border-radius:50%;
    overflow:hidden;

    display:flex;
    align-items:center;
    justify-content:center;

    background:var(--black);
    color:white;
    font-weight:bold;
}

.post-avatar img{
    width:100%;
    height:100%;
    object-fit:cover;
}

.post-user{
    flex:1;
}

.post-name{
    font-weight:bold;
}

.post-time{
    color:#999;
    font-size:11px;
    margin-top:3px;
}

.post-text{
    margin-top:14px;
    line-height:1.6;
    white-space:pre-wrap;
}

.post-media{
    margin-top:14px;
}

.post-media img,
.post-media video{
    display:block;
    width:100%;
    max-height:500px;
    object-fit:contain;
    border-radius:14px;
    background:#050505;
}

.post-actions{
    display:flex;
    align-items:center;
    gap:8px;
    margin-top:13px;
}

.post-actions button{
    border:none;
    background:#eee;
    padding:8px 12px;
    border-radius:8px;
    cursor:pointer;
}

.delete-post{
    background:var(--red)!important;
    color:white;
}

/* =========================
   MEMBERS
========================= */

.member-grid{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:10px;
}

.member{
    display:flex;
    align-items:center;
    gap:10px;
    padding:12px;
    border:1px solid #eee;
    border-radius:13px;
}

.member-avatar{
    width:45px;
    height:45px;
    min-width:45px;

    border-radius:50%;
    overflow:hidden;

    background:var(--black);
    color:white;

    display:flex;
    align-items:center;
    justify-content:center;

    font-weight:bold;
}

.member-avatar img{
    width:100%;
    height:100%;
    object-fit:cover;
}

.member-name{
    font-weight:bold;
}

.member-status{
    color:#16a34a;
    font-size:11px;
    margin-top:4px;
}

/* =========================
   EMPTY
========================= */

.empty{
    padding:25px;
    text-align:center;
    color:#888;
}

/* =========================
   LOADING
========================= */

#loading{
    position:fixed;
    inset:0;
    z-index:9999;

    background:#050505;
    color:white;

    display:flex;
    align-items:center;
    justify-content:center;
    flex-direction:column;
}

.loading-logo{
    font-size:70px;
    font-weight:1000;
    letter-spacing:-8px;
}

.loading-logo span{
    color:var(--red);
}

.loader{
    width:150px;
    height:3px;
    background:#333;
    margin-top:20px;
    overflow:hidden;
}

.loader div{
    width:50%;
    height:100%;
    background:var(--red);
    animation:loading 1s infinite;
}

@keyframes loading{
    from{
        transform:translateX(-150%);
    }

    to{
        transform:translateX(300%);
    }
}

/* =========================
   TOAST
========================= */

.toast{
    position:fixed;
    bottom:25px;
    left:50%;
    transform:translateX(-50%) translateY(100px);

    background:#050505;
    color:white;

    padding:13px 18px;
    border-radius:10px;

    z-index:5000;

    opacity:0;
    transition:.3s;
}

.toast.show{
    opacity:1;
    transform:translateX(-50%) translateY(0);
}

/* =========================
   MOBILE
========================= */

@media(max-width:700px){

    .container{
        width:95%;
        margin:15px auto;
    }

    .nav{
        min-height:58px;
    }

    .logo{
        font-size:31px;
    }

    .logout{
        padding:8px 11px;
        font-size:12px;
    }

    .welcome{
        padding:23px;
        border-radius:18px;
    }

    .welcome h1{
        font-size:23px;
    }

    .card{
        padding:16px;
        border-radius:16px;
    }

    .member-grid{
        grid-template-columns:1fr;
    }

    .composer-tools{
        flex-direction:column;
        align-items:stretch;
    }

    .upload-buttons{
        width:100%;
    }

    .upload-btn{
        flex:1;
    }

    .post-btn{
        width:100%;
    }

    .post-media img,
    .post-media video{
        max-height:400px;
    }
}

@media(max-width:400px){

    .welcome h1{
        font-size:20px;
    }

    .profile-pic{
        width:65px;
        height:65px;
    }

    .profile-name{
        font-size:17px;
    }

    .upload-btn{
        font-size:12px;
        padding:9px;
    }
}
</style>
</head>

<body>

<!-- LOADING -->

<div id="loading">

    <div class="loading-logo">
        F<span>4</span>
    </div>

    <div class="loader">
        <div></div>
    </div>

</div>


<!-- HEADER -->

<header>

    <div class="nav">

        <div class="logo">
            F<span>4</span>
        </div>

        <div class="nav-right">

            <button
                class="logout"
                id="logoutBtn"
            >
                Logout
            </button>

        </div>

    </div>

</header>


<main class="container">

<!-- WELCOME -->

<section class="welcome">

    <h1>
        Welcome,
        <span id="welcomeName">
            F4 Member
        </span>
        👑
    </h1>

    <p>
        Welcome to the F4 Community.
        Stay active. Stay united.
    </p>

</section>


<!-- PROFILE -->

<section class="card">

    <div class="card-title">
        👤 My Profile
    </div>

    <div class="profile">

        <div class="profile-pic-wrapper">

            <div
                class="profile-pic"
                id="profilePic"
            >
                F
            </div>

            <button
                class="change-photo"
                id="changePhoto"
            >
                +
            </button>

        </div>

        <div class="profile-info">

            <div
                class="profile-name"
                id="profileName"
            >
                Loading...
            </div>

            <div
                class="profile-email"
                id="profileEmail"
            >
                Loading...
            </div>

        </div>

    </div>

    <input
        type="file"
        id="profilePhotoInput"
        accept="image/*"
        hidden
    >

</section>


<!-- ANNOUNCEMENTS -->

<section class="card announcement-card">

    <div class="card-title">
        📢 F4 Announcements
    </div>

    <div id="announcements">
        Loading announcements...
    </div>

</section>


<!-- CREATE POST -->

<section class="card composer">

    <div class="card-title">
        📝 Create a Post
    </div>

    <textarea
        id="postText"
        placeholder="Say something to the F4 family..."
    ></textarea>

    <div class="upload-preview">

        <img
            id="imagePreview"
            class="preview-image"
        >

        <video
            id="videoPreview"
            class="preview-video"
            controls
        ></video>

    </div>

    <input
        type="file"
        id="imageInput"
        accept="image/*"
        hidden
    >

    <input
        type="file"
        id="videoInput"
        accept="video/*"
        hidden
    >

    <div class="composer-tools">

        <div class="upload-buttons">

            <button
                class="upload-btn"
                id="imageButton"
            >
                🖼️ Photo
            </button>

            <button
                class="upload-btn"
                id="videoButton"
            >
                🎥 Video
            </button>

        </div>

        <button
            class="post-btn"
            id="postBtn"
        >
            Post
        </button>

    </div>

</section>


<!-- FEED -->

<section class="card">

    <div class="card-title">
        🔥 F4 Feed
    </div>

    <div id="feed">
        Loading posts...
    </div>

</section>


<!-- MEMBERS -->

<section class="card">

    <div class="card-title">
        👥 F4 Members
    </div>

    <div
        class="member-grid"
        id="members"
    >
        Loading members...
    </div>

</section>

</main>


<div
    class="toast"
    id="toast"
></div>


<script type="module">

/* =====================================================
   FIREBASE
===================================================== */

import {
    initializeApp
} from "https://www.gstatic.com/firebasejs/12.17.1/firebase-app.js";

import {
    getAuth,
    onAuthStateChanged,
    signOut
} from "https://www.gstatic.com/firebasejs/12.17.1/firebase-auth.js";

import {
    getFirestore,
    collection,
    doc,
    getDoc,
    setDoc,
    updateDoc,
    addDoc,
    deleteDoc,
    onSnapshot,
    query,
    orderBy,
    serverTimestamp
} from "https://www.gstatic.com/firebasejs/12.17.1/firebase-firestore.js";


/* =====================================================
   FIREBASE CONFIG
===================================================== */

const firebaseConfig = {

    apiKey:
    "AIzaSyAjPnE3Km8yo_57t6kpUc7Jj9TtXqeBKew",

    authDomain:
    "website-53417.firebaseapp.com",

    projectId:
    "website-53417",

    storageBucket:
    "website-53417.firebasestorage.app",

    messagingSenderId:
    "1049856174962",

    appId:
    "1:1049856174962:web:dd00fbfdb5ed6bd66a8beb",

    measurementId:
    "G-MGPGXVFKWH"
};


/* =====================================================
   INITIALIZE
===================================================== */

const app =
initializeApp(firebaseConfig);

const auth =
getAuth(app);

const db =
getFirestore(app);


/* =====================================================
   CLOUDINARY
===================================================== */

const CLOUDINARY_CLOUD =
"dtdvur5lw";

const CLOUDINARY_PRESET =
"emmanuel";


/* =====================================================
   GLOBAL VARIABLES
===================================================== */

let currentUser = null;
let currentProfile = null;

let selectedImage = null;
let selectedVideo = null;


/* =====================================================
   AUTH
===================================================== */

onAuthStateChanged(
    auth,
    async user => {

        if(!user){

            window.location.href =
            "login.html";

            return;
        }

        currentUser = user;

        try{

            await loadProfile();

            loadAnnouncements();

            loadMembers();

            loadPosts();

            document
            .getElementById("loading")
            .style.display = "none";

        }catch(error){

            console.error(error);

            showToast(
                "Unable to load your profile."
            );

        }

    }
);


/* =====================================================
   PROFILE
===================================================== */

async function loadProfile(){

    const userRef =
    doc(
        db,
        "users",
        currentUser.uid
    );

    const snapshot =
    await getDoc(userRef);

    let data;


    if(snapshot.exists()){

        data =
        snapshot.data();

    }else{

        data = {

            uid:
            currentUser.uid,

            name:
            currentUser.displayName ||
            currentUser.email
            ?.split("@")[0] ||
            "F4 Member",

            email:
            currentUser.email || "",

            f4Member:true,

            photoURL:"",

            createdAt:
            serverTimestamp()

        };

        await setDoc(
            userRef,
            data
        );

    }


    /*
       Existing authenticated users are
       recognized as F4 members.
    */

    if(data.f4Member !== true){

        await updateDoc(
            userRef,
            {
                f4Member:true
            }
        );

        data.f4Member = true;

    }


    currentProfile = data;


    updateProfileUI();

}


/* =====================================================
   UPDATE PROFILE UI
===================================================== */

function updateProfileUI(){

    const name =
    currentProfile.name ||
    currentUser.displayName ||
    currentUser.email
    ?.split("@")[0] ||
    "F4 Member";


    document
    .getElementById("welcomeName")
    .textContent =
    name;


    document
    .getElementById("profileName")
    .textContent =
    name;


    document
    .getElementById("profileEmail")
    .textContent =
    currentProfile.email ||
    currentUser.email ||
    "";


    const profilePic =
    document.getElementById(
        "profilePic"
    );


    if(currentProfile.photoURL){

        profilePic.innerHTML =
        `
        <img
            src="${escapeHTML(
                currentProfile.photoURL
            )}"
        >
        `;

    }else{

        profilePic.textContent =
        name.charAt(0)
        .toUpperCase();

    }

}


/* =====================================================
   PROFILE PHOTO BUTTON
===================================================== */

document
.getElementById("changePhoto")
.addEventListener(
    "click",
    () => {

        document
        .getElementById(
            "profilePhotoInput"
        )
        .click();

    }
);


/* =====================================================
   PROFILE PHOTO UPLOAD
===================================================== */

document
.getElementById("profilePhotoInput")
.addEventListener(
    "change",
    async event => {

        const file =
        event.target.files[0];

        if(!file)
            return;


        if(!file.type.startsWith("image/")){

            showToast(
                "Please select an image."
            );

            return;

        }


        try{

            showToast(
                "Uploading profile picture..."
            );


            const url =
            await uploadToCloudinary(
                file,
                "image"
            );


            await updateDoc(

                doc(
                    db,
                    "users",
                    currentUser.uid
                ),

                {
                    photoURL:url
                }

            );


            currentProfile.photoURL =
            url;


            updateProfileUI();


            showToast(
                "Profile picture updated! ✅"
            );


        }catch(error){

            console.error(error);

            showToast(
                "Profile picture upload failed."
            );

        }

    }
);


/* =====================================================
   IMAGE BUTTON
===================================================== */

document
.getElementById("imageButton")
.addEventListener(
    "click",
    () => {

        document
        .getElementById("imageInput")
        .click();

    }
);


/* =====================================================
   VIDEO BUTTON
===================================================== */

document
.getElementById("videoButton")
.addEventListener(
    "click",
    () => {

        document
        .getElementById("videoInput")
        .click();

    }
);


/* =====================================================
   IMAGE SELECTED
===================================================== */

document
.getElementById("imageInput")
.addEventListener(
    "change",
    event => {

        const file =
        event.target.files[0];

        if(!file)
            return;


        selectedImage = file;

        selectedVideo = null;


        const imagePreview =
        document.getElementById(
            "imagePreview"
        );

        const videoPreview =
        document.getElementById(
            "videoPreview"
        );


        videoPreview.style.display =
        "none";

        videoPreview.src = "";


        imagePreview.src =
        URL.createObjectURL(file);

        imagePreview.style.display =
        "block";

    }
);


/* =====================================================
   VIDEO SELECTED
===================================================== */

document
.getElementById("videoInput")
.addEventListener(
    "change",
    event => {

        const file =
        event.target.files[0];

        if(!file)
            return;


        selectedVideo = file;

        selectedImage = null;


        const imagePreview =
        document.getElementById(
            "imagePreview"
        );

        const videoPreview =
        document.getElementById(
            "videoPreview"
        );


        imagePreview.style.display =
        "none";

        imagePreview.src = "";


        videoPreview.src =
        URL.createObjectURL(file);

        videoPreview.style.display =
        "block";

    }
);


/* =====================================================
   CLOUDINARY UPLOAD
===================================================== */

async function uploadToCloudinary(
    file,
    type
){

    const formData =
    new FormData();


    formData.append(
        "file",
        file
    );


    formData.append(
        "upload_preset",
        CLOUDINARY_PRESET
    );


    const resourceType =
    type === "video"
    ?
    "video"
    :
    "image";


    const response =
    await fetch(

        `https://api.cloudinary.com/v1_1/${CLOUDINARY_CLOUD}/${resourceType}/upload`,

        {
            method:"POST",
            body:formData
        }

    );


    if(!response.ok){

        throw new Error(
            "Cloudinary upload failed"
        );

    }


    const data =
    await response.json();


    return data.secure_url;

}


/* =====================================================
   CREATE POST
===================================================== */

document
.getElementById("postBtn")
.addEventListener(
    "click",
    async () => {

        const text =
        document
        .getElementById("postText")
        .value
        .trim();


        if(
            !text &&
            !selectedImage &&
            !selectedVideo
        ){

            showToast(
                "Write something or add a photo/video."
            );

            return;

        }


        const button =
        document.getElementById(
            "postBtn"
        );


        button.disabled = true;

        button.textContent =
        "Posting...";


        try{

            let mediaURL = "";

            let mediaType = "";


            /* IMAGE */

            if(selectedImage){

                mediaURL =
                await uploadToCloudinary(
                    selectedImage,
                    "image"
                );

                mediaType =
                "image";

            }


            /* VIDEO */

            if(selectedVideo){

                mediaURL =
                await uploadToCloudinary(
                    selectedVideo,
                    "video"
                );

                mediaType =
                "video";

            }


            await addDoc(

                collection(
                    db,
                    "posts"
                ),

                {

                    uid:
                    currentUser.uid,

                    name:
                    currentProfile.name ||
                    "F4 Member",

                    email:
                    currentUser.email ||
                    "",

                    photoURL:
                    currentProfile.photoURL ||
                    "",

                    text:text,

                    mediaURL:
                    mediaURL,

                    mediaType:
                    mediaType,

                    createdAt:
                    serverTimestamp()

                }

            );


            clearComposer();


            showToast(
                "Posted successfully! 🔥"
            );


        }catch(error){

            console.error(error);

            showToast(
                "Could not create post."
            );

        }finally{

            button.disabled = false;

            button.textContent =
            "Post";

        }

    }
);


/* =====================================================
   CLEAR COMPOSER
===================================================== */

function clearComposer(){

    document
    .getElementById("postText")
    .value = "";


    document
    .getElementById("imageInput")
    .value = "";


    document
    .getElementById("videoInput")
    .value = "";


    selectedImage = null;

    selectedVideo = null;


    document
    .getElementById("imagePreview")
    .style.display =
    "none";


    document
    .getElementById("videoPreview")
    .style.display =
    "none";


    document
    .getElementById("imagePreview")
    .src = "";


    document
    .getElementById("videoPreview")
    .src = "";

}


/* =====================================================
   LOAD POSTS
===================================================== */

function loadPosts(){

    const q =
    query(

        collection(
            db,
            "posts"
        ),

        orderBy(
            "createdAt",
            "desc"
        )

    );


    onSnapshot(

        q,

        snapshot => {

            const feed =
            document.getElementById(
                "feed"
            );


            feed.innerHTML = "";


            if(snapshot.empty){

                feed.innerHTML =
                `
                <div class="empty">
                    No posts yet. Be the first!
                </div>
                `;

                return;

            }


            snapshot.forEach(
                postDoc => {

                    const data =
                    postDoc.data();


                    const post =
                    document.createElement(
                        "div"
                    );


                    post.className =
                    "post";


                    const name =
                    data.name ||
                    "F4 Member";


                    const initial =
                    name
                    .charAt(0)
                    .toUpperCase();


                    let mediaHTML = "";


                    if(
                        data.mediaType ===
                        "image" &&
                        data.mediaURL
                    ){

                        mediaHTML =
                        `
                        <div class="post-media">

                            <img
                                src="${escapeHTML(
                                    data.mediaURL
                                )}"
                                loading="lazy"
                            >

                        </div>
                        `;

                    }


                    if(
                        data.mediaType ===
                        "video" &&
                        data.mediaURL
                    ){

                        mediaHTML =
                        `
                        <div class="post-media">

                            <video
                                src="${escapeHTML(
                                    data.mediaURL
                                )}"
                                controls
                                playsinline
                                preload="metadata"
                            ></video>

                        </div>
                        `;

                    }


                    post.innerHTML =
                    `

                    <div class="post-header">

                        <div class="post-avatar">

                            ${
                                data.photoURL
                                ?
                                `
                                <img
                                    src="${escapeHTML(
                                        data.photoURL
                                    )}"
                                >
                                `
                                :
                                initial
                            }

                        </div>


                        <div class="post-user">

                            <div class="post-name">

                                ${escapeHTML(
                                    name
                                )}

                            </div>

                            <div class="post-time">

                                F4 Community

                            </div>

                        </div>

                    </div>


                    ${
                        data.text
                        ?
                        `
                        <div class="post-text">

                            ${escapeHTML(
                                data.text
                            )}

                        </div>
                        `
                        :
                        ""
                    }


                    ${mediaHTML}


                    <div class="post-actions">

                        <button>
                            ❤️ Like
                        </button>


                        ${
                            data.uid ===
                            currentUser.uid
                            ?
                            `
                            <button
                                class="delete-post"
                            >
                                🗑️ Delete
                            </button>
                            `
                            :
                            ""
                        }

                    </div>

                    `;


                    feed.appendChild(post);


                    const deleteButton =
                    post.querySelector(
                        ".delete-post"
                    );


                    if(deleteButton){

                        deleteButton
                        .addEventListener(
                            "click",
                            async () => {

                                if(
                                    !confirm(
                                        "Delete your post?"
                                    )
                                ){

                                    return;

                                }


                                try{

                                    await deleteDoc(

                                        doc(
                                            db,
                                            "posts",
                                            postDoc.id
                                        )

                                    );


                                    showToast(
                                        "Post deleted."
                                    );


                                }catch(error){

                                    console.error(
                                        error
                                    );

                                    showToast(
                                        "You can only delete your own posts."
                                    );

                                }

                            }
                        );

                    }

                }
            );

        },

        error => {

            console.error(error);

            document
            .getElementById("feed")
            .innerHTML =
            `
            <div class="empty">
                Unable to load the F4 feed.
            </div>
            `;

        }

    );

}


/* =====================================================
   LOAD MEMBERS
===================================================== */

function loadMembers(){

    onSnapshot(

        collection(
            db,
            "users"
        ),

        snapshot => {

            const members =
            document.getElementById(
                "members"
            );


            members.innerHTML = "";


            let count = 0;


            snapshot.forEach(
                userDoc => {

                    const data =
                    userDoc.data();


                    /*
                    IMPORTANT:

                    Only users who have
                    f4Member:true appear.
                    */

                    if(
                        data.f4Member !== true
                    ){

                        return;

                    }


                    count++;


                    const name =
                    data.name ||
                    "F4 Member";


                    const initial =
                    name
                    .charAt(0)
                    .toUpperCase();


                    const div =
                    document.createElement(
                        "div"
                    );


                    div.className =
                    "member";


                    div.innerHTML =
                    `

                    <div class="member-avatar">

                        ${
                            data.photoURL
                            ?
                            `
                            <img
                                src="${escapeHTML(
                                    data.photoURL
                                )}"
                            >
                            `
                            :
                            initial
                        }

                    </div>


                    <div>

                        <div class="member-name">

                            ${escapeHTML(
                                name
                            )}

                        </div>

                        <div class="member-status">

                            ● F4 Member

                        </div>

                    </div>

                    `;


                    members.appendChild(div);

                }
            );


            if(count === 0){

                members.innerHTML =
                `
                <div class="empty">
                    No other F4 members yet.
                </div>
                `;

            }

        }

    );

}

/* =====================================================
   TOAST
===================================================== */

function showToast(message){

    const toast =
    document.getElementById(
        "toast"
    );


    toast.textContent =
    message;


    toast.classList.add(
        "show"
    );


    setTimeout(
        () => {

            toast.classList.remove(
                "show"
            );

        },
        3000
    );

}


/* =====================================================
   ESCAPE HTML
===================================================== */

function escapeHTML(value){

    return String(value || "")
    .replaceAll(
        "&",
        "&amp;"
    )
    .replaceAll(
        "<",
        "&lt;"
    )
    .replaceAll(
        ">",
        "&gt;"
    )
    .replaceAll(
        '"',
        "&quot;"
    )
    .replaceAll(
        "'",
        "&#039;"
    );

}
