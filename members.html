<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>F4 Community</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family:Arial,sans-serif;
    background:#f4f4f4;
    color:#111;
}

header{
    background:#050505;
    color:white;
    padding:16px;
    position:sticky;
    top:0;
    z-index:100;
    box-shadow:0 4px 20px rgba(0,0,0,.2);
}

.nav{
    max-width:1100px;
    margin:auto;
    display:flex;
    align-items:center;
    justify-content:space-between;
}

.logo{
    font-size:36px;
    font-weight:1000;
    letter-spacing:-5px;
}

.logo span{
    color:#e50914;
}

.logout{
    background:#e50914;
    color:white;
    border:0;
    padding:9px 14px;
    border-radius:8px;
    font-weight:bold;
}

.container{
    width:94%;
    max-width:1100px;
    margin:22px auto;
}

/* WELCOME */

.welcome{
    background:#050505;
    color:white;
    padding:25px;
    border-radius:20px;
    margin-bottom:20px;
}

.welcome h1{
    font-size:28px;
}

.welcome span{
    color:#e50914;
}

/* CARDS */

.card{
    background:white;
    padding:20px;
    border-radius:18px;
    margin-bottom:20px;
    box-shadow:0 5px 20px rgba(0,0,0,.07);
}

.card h2{
    margin-bottom:14px;
}

/* ANNOUNCEMENT */

.announcement{
    border-left:5px solid #e50914;
}

.announcement-item{
    background:#050505;
    color:white;
    padding:15px;
    border-radius:12px;
    margin-top:10px;
}

.announcement-item small{
    color:#aaa;
}

/* PROFILE */

.profile{
    display:flex;
    align-items:center;
    gap:15px;
}

.profile-pic{
    width:65px;
    height:65px;
    border-radius:50%;
    background:#050505;
    color:white;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:25px;
    font-weight:bold;
    overflow:hidden;
}

.profile-pic img{
    width:100%;
    height:100%;
    object-fit:cover;
}

.profile-name{
    font-size:20px;
    font-weight:bold;
}

.profile-email{
    color:#777;
    font-size:13px;
}

/* POST */

textarea{
    width:100%;
    min-height:100px;
    padding:14px;
    border:1px solid #ddd;
    border-radius:12px;
    resize:vertical;
    outline:none;
    font-family:Arial;
}

textarea:focus{
    border-color:#e50914;
}

button{
    cursor:pointer;
}

.post-btn{
    background:#e50914;
    color:white;
    border:0;
    padding:11px 18px;
    border-radius:9px;
    margin-top:10px;
    font-weight:bold;
}

/* POSTS */

.post{
    border:1px solid #eee;
    padding:15px;
    border-radius:14px;
    margin-top:15px;
}

.post-header{
    display:flex;
    gap:10px;
    align-items:center;
}

.post-avatar{
    width:42px;
    height:42px;
    border-radius:50%;
    background:#050505;
    color:white;
    display:flex;
    align-items:center;
    justify-content:center;
    overflow:hidden;
    font-weight:bold;
}

.post-avatar img{
    width:100%;
    height:100%;
    object-fit:cover;
}

.post-name{
    font-weight:bold;
}

.post-time{
    color:#888;
    font-size:11px;
}

.post-text{
    margin-top:13px;
    line-height:1.5;
}

.post-actions{
    display:flex;
    gap:10px;
    margin-top:12px;
}

.post-actions button{
    background:#eee;
    border:0;
    padding:8px 12px;
    border-radius:8px;
}

.delete-post{
    background:#e50914 !important;
    color:white;
}

/* MEMBERS */

.member{
    display:flex;
    align-items:center;
    gap:12px;
    padding:12px 0;
    border-bottom:1px solid #eee;
}

.member:last-child{
    border-bottom:0;
}

.member-avatar{
    width:45px;
    height:45px;
    border-radius:50%;
    background:#050505;
    color:white;
    display:flex;
    align-items:center;
    justify-content:center;
    overflow:hidden;
    font-weight:bold;
}

.member-avatar img{
    width:100%;
    height:100%;
    object-fit:cover;
}

.member-info{
    flex:1;
}

.member-name{
    font-weight:bold;
}

.member-status{
    color:#16a34a;
    font-size:12px;
}

/* LOADING */

#loading{
    position:fixed;
    inset:0;
    background:#050505;
    color:white;
    z-index:9999;
    display:flex;
    align-items:center;
    justify-content:center;
    flex-direction:column;
}

.loading-logo{
    font-size:65px;
    font-weight:1000;
    letter-spacing:-8px;
}

.loading-logo span{
    color:#e50914;
}

.loader{
    width:150px;
    height:3px;
    background:#333;
    margin-top:20px;
    overflow:hidden;
}

.loader div{
    height:100%;
    width:50%;
    background:#e50914;
    animation:load 1s infinite;
}

@keyframes load{
    from{
        transform:translateX(-150%);
    }
    to{
        transform:translateX(300%);
    }
}

.empty{
    text-align:center;
    color:#888;
    padding:20px;
}

@media(max-width:600px){

    .welcome h1{
        font-size:23px;
    }

    .logo{
        font-size:30px;
    }
}
</style>
</head>

<body>

<div id="loading">

    <div class="loading-logo">
        F<span>4</span>
    </div>

    <div class="loader">
        <div></div>
    </div>

</div>


<header>

    <div class="nav">

        <div class="logo">
            F<span>4</span>
        </div>

        <button
            class="logout"
            id="logoutBtn"
        >
            Logout
        </button>

    </div>

</header>


<div class="container">


<!-- WELCOME -->

<div class="welcome">

    <h1>
        Welcome, <span id="welcomeName">F4 Member</span> 👑
    </h1>

    <p style="margin-top:8px;color:#ccc;">
        Welcome to the F4 Community.
    </p>

</div>


<!-- PROFILE -->

<div class="card">

    <h2>👤 My Profile</h2>

    <div class="profile">

        <div
            class="profile-pic"
            id="profilePic"
        >
            F
        </div>

        <div>

            <div
                class="profile-name"
                id="profileName"
            >
                Loading...
            </div>

            <div
                class="profile-email"
                id="profileEmail"
            >
                Loading...
            </div>

        </div>

    </div>

</div>


<!-- ANNOUNCEMENTS -->

<div class="card announcement">

    <h2>📢 F4 Announcements</h2>

    <div id="announcements">

        Loading announcements...

    </div>

</div>


<!-- CREATE POST -->

<div class="card">

    <h2>📝 Create a Post</h2>

    <textarea
        id="postText"
        placeholder="Say something to the F4 family..."
    ></textarea>

    <button
        class="post-btn"
        id="postBtn"
    >
        Post
    </button>

</div>


<!-- POSTS -->

<div class="card">

    <h2>🔥 F4 Feed</h2>

    <div id="feed">

        Loading posts...

    </div>

</div>


<!-- MEMBERS -->

<div class="card">

    <h2>👥 F4 Members</h2>

    <div id="members">

        Loading members...

    </div>

</div>


</div>


<script type="module">

/* =====================================
   FIREBASE
===================================== */

import {
    initializeApp
} from "https://www.gstatic.com/firebasejs/12.17.1/firebase-app.js";


import {
    getAuth,
    onAuthStateChanged,
    signOut
} from "https://www.gstatic.com/firebasejs/12.17.1/firebase-auth.js";


import {
    getFirestore,
    doc,
    getDoc,
    setDoc,
    updateDoc,
    collection,
    addDoc,
    deleteDoc,
    onSnapshot,
    serverTimestamp,
    query,
    orderBy
} from "https://www.gstatic.com/firebasejs/12.17.1/firebase-firestore.js";


/* =====================================
   CONFIG
===================================== */

const firebaseConfig = {

    apiKey:
    "AIzaSyAjPnE3Km8yo_57t6kpUc7Jj9TtXqeBKew",

    authDomain:
    "website-53417.firebaseapp.com",

    projectId:
    "website-53417",

    storageBucket:
    "website-53417.firebasestorage.app",

    messagingSenderId:
    "1049856174962",

    appId:
    "1:1049856174962:web:dd00fbfdb5ed6bd66a8beb",

    measurementId:
    "G-MGPGXVFKWH"
};


const app =
initializeApp(firebaseConfig);

const auth =
getAuth(app);

const db =
getFirestore(app);


let currentUser = null;
let currentProfile = null;


/* =====================================
   AUTH
===================================== */

onAuthStateChanged(
    auth,
    async user => {

        if(!user){

            window.location.href =
            "login.html";

            return;
        }


        currentUser = user;


        try{

            await loadUserProfile();

            loadAnnouncements();

            loadMembers();

            loadPosts();


            document
            .getElementById("loading")
            .style.display =
            "none";


        }catch(error){

            console.error(error);

            alert(
                "Unable to load your F4 profile."
            );

        }

    }
);


/* =====================================
   USER PROFILE

   IMPORTANT FIX:

   We use the logged-in Firebase UID.
   We DON'T reject the user simply
   because f4Member was missing.
===================================== */

async function loadUserProfile(){

    const userRef =
    doc(
        db,
        "users",
        currentUser.uid
    );


    const userSnap =
    await getDoc(userRef);


    let data = {};


    if(userSnap.exists()){

        data =
        userSnap.data();

    }else{

        /*
        If the Auth account exists but
        the Firestore profile doesn't,
        create the profile now.
        */

        data = {

            uid:
            currentUser.uid,

            name:
            currentUser.displayName ||
            currentUser.email
            ?.split("@")[0] ||
            "F4 Member",

            email:
            currentUser.email || "",

            f4Member:true,

            createdAt:
            serverTimestamp()

        };


        await setDoc(
            userRef,
            data
        );

    }


    /*
    Make sure existing website users
    are recognized as F4 members.
    */

    if(data.f4Member !== true){

        await updateDoc(
            userRef,
            {
                f4Member:true
            }
        );

        data.f4Member = true;

    }


    currentProfile = data;


    const name =
    data.name ||
    currentUser.displayName ||
    currentUser.email
    ?.split("@")[0] ||
    "F4 Member";


    document
    .getElementById("welcomeName")
    .textContent =
    name;


    document
    .getElementById("profileName")
    .textContent =
    name;


    document
    .getElementById("profileEmail")
    .textContent =
    data.email ||
    currentUser.email ||
    "";


    const pic =
    data.photoURL;


    const profilePic =
    document.getElementById(
        "profilePic"
    );


    if(pic){

        profilePic.innerHTML =
        `<img src="${escapeHTML(pic)}">`;

    }else{

        profilePic.textContent =
        name.charAt(0).toUpperCase();

    }

}


/* =====================================
   LOGOUT
===================================== */

document
.getElementById("logoutBtn")
.addEventListener(
    "click",
    async () => {

        await signOut(auth);

        window.location.href =
        "login.html";

    }
);


/* =====================================
   ANNOUNCEMENTS
===================================== */

function loadAnnouncements(){

    const q =
    query(

        collection(
            db,
            "announcements"
        ),

        orderBy(
            "createdAt",
            "desc"
        )

    );


    onSnapshot(

        q,

        snapshot => {

            const container =
            document.getElementById(
                "announcements"
            );


            container.innerHTML = "";


            if(snapshot.empty){

                container.innerHTML =
                `
                <div class="empty">
                    No announcements yet.
                </div>
                `;

                return;
            }


            snapshot.forEach(
                announcement => {

                    const data =
                    announcement.data();


                    const div =
                    document.createElement(
                        "div"
                    );


                    div.className =
                    "announcement-item";


                    div.innerHTML =
                    `
                    <p>
                        ${escapeHTML(
                            data.text || ""
                        )}
                    </p>

                    <small>
                        📢 F4 Administration
                    </small>
                    `;


                    container.appendChild(div);

                }
            );

        },

        error => {

            console.error(error);

            document
            .getElementById(
                "announcements"
            )
            .innerHTML =
            `
            <div class="empty">
                Announcements unavailable.
            </div>
            `;

        }

    );

}


/* =====================================
   CREATE POST
===================================== */

document
.getElementById("postBtn")
.addEventListener(
    "click",
    async () => {

        const textarea =
        document.getElementById(
            "postText"
        );


        const text =
        textarea.value.trim();


        if(!text){

            alert(
                "Write something first."
            );

            return;
        }


        try{

            await addDoc(

                collection(
                    db,
                    "posts"
                ),

                {

                    uid:
                    currentUser.uid,

                    name:
                    currentProfile.name,

                    email:
                    currentUser.email,

                    photoURL:
                    currentProfile.photoURL ||
                    "",

                    text:
                    text,

                    createdAt:
                    serverTimestamp()

                }

            );


            textarea.value = "";


        }catch(error){

            console.error(error);

            alert(
                "Unable to create post."
            );

        }

    }
);


/* =====================================
   LOAD POSTS
===================================== */

function loadPosts(){

    const q =
    query(

        collection(
            db,
            "posts"
        ),

        orderBy(
            "createdAt",
            "desc"
        )

    );


    onSnapshot(

        q,

        snapshot => {

            const feed =
            document.getElementById(
                "feed"
            );


            feed.innerHTML = "";


            if(snapshot.empty){

                feed.innerHTML =
                `
                <div class="empty">
                    No posts yet. Be the first!
                </div>
                `;

                return;
            }


            snapshot.forEach(
                postDoc => {

                    const post =
                    postDoc.data();


                    const div =
                    document.createElement(
                        "div"
                    );


                    div.className =
                    "post";


                    const initial =
                    (
                        post.name ||
                        "F"
                    )
                    .charAt(0)
                    .toUpperCase();


                    div.innerHTML =
                    `

                    <div class="post-header">

                        <div class="post-avatar">

                            ${
                                post.photoURL
                                ?
                                `<img src="${escapeHTML(
                                    post.photoURL
                                )}">`
                                :
                                initial
                            }

                        </div>


                        <div>

                            <div class="post-name">

                                ${escapeHTML(
                                    post.name ||
                                    "F4 Member"
                                )}

                            </div>

                            <div class="post-time">
                                F4 Community
                            </div>

                        </div>

                    </div>


                    <div class="post-text">

                        ${escapeHTML(
                            post.text || ""
                        )}

                    </div>


                    <div class="post-actions">

                        <button>
                            ❤️ Like
                        </button>

                        ${
                            post.uid ===
                            currentUser.uid
                            ?
                            `
                            <button
                                class="delete-post"
                                data-id="${postDoc.id}"
                            >
                                🗑️ Delete
                            </button>
                            `
                            :
                            ""
                        }

                    </div>

                    `;


                    feed.appendChild(div);


                    const deleteButton =
                    div.querySelector(
                        ".delete-post"
                    );


                    if(deleteButton){

                        deleteButton
                        .addEventListener(
                            "click",
                            async () => {

                                if(
                                    !confirm(
                                        "Delete this post?"
                                    )
                                ){

                                    return;

                                }


                                try{

                                    await deleteDoc(

                                        doc(
                                            db,
                                            "posts",
                                            postDoc.id
                                        )

                                    );

                                }catch(error){

                                    console.error(
                                        error
                                    );

                                    alert(
                                        "You cannot delete this post."
                                    );

                                }

                            }
                        );

                    }

                }
            );

        }

    );

}


/* =====================================
   MEMBERS

   ONLY profiles marked f4Member:true
   are displayed.
===================================== */

function loadMembers(){

    onSnapshot(

        collection(
            db,
            "users"
        ),

        snapshot => {

            const container =
            document.getElementById(
                "members"
            );


            container.innerHTML = "";


            let count = 0;


            snapshot.forEach(
                userDoc => {

                    const data =
                    userDoc.data();


                    /*
                    Don't show unrelated
                    Firebase user documents.
                    */

                    if(
                        data.f4Member !== true
                    ){

                        return;
                    }


                    count++;


                    const name =
                    data.name ||
                    "F4 Member";


                    const initial =
                    name
                    .charAt(0)
                    .toUpperCase();


                    const div =
                    document.createElement(
                        "div"
                    );


                    div.className =
                    "member";


                    div.innerHTML =
                    `

                    <div class="member-avatar">

                        ${
                            data.photoURL
                            ?
                            `<img src="${escapeHTML(
                                data.photoURL
                            )}">`
                            :
                            initial
                        }

                    </div>


                    <div class="member-info">

                        <div class="member-name">

                            ${escapeHTML(name)}

                        </div>

                        <div class="member-status">

                            ● F4 Member

                        </div>

                    </div>

                    `;


                    container.appendChild(div);

                }
            );


            if(count === 0){

                container.innerHTML =
                `
                <div class="empty">
                    You're the first F4 member.
                </div>
                `;

            }

        }

    );

}


/* =====================================
   ESCAPE HTML
===================================== */

function escapeHTML(value){

    return String(value || "")
    .replaceAll(
        "&",
        "&amp;"
    )
    .replaceAll(
        "<",
        "&lt;"
    )
    .replaceAll(
        ">",
        "&gt;"
    )
    .replaceAll(
        '"',
        "&quot;"
    )
    .replaceAll(
        "'",
        "&#039;"
    );

}

</script>

</body>
</html>
